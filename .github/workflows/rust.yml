name: Rust

on:
  push:
    branches: [main, "poc/**"]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Smoke test
        run: |
          ./target/release/mdview --version
          ./target/release/mdview --check
          ./target/release/mdview -c ../examples/demo.md > /dev/null
