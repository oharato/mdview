version: 2
updates:
  # GitHub Actions のバージョン
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

  # Rust 依存
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(rust-deps)"
    ignore:
      # 2.10 以降は別メンテナのフォーク。公式 2.9.0 に固定する。
      - dependency-name: "pulldown-cmark-mdcat"
      # vendored patch (see vendor/mermaid-rs-renderer/PATCHES.md)
      - dependency-name: "mermaid-rs-renderer"
    groups:
      rust-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
