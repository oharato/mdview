[package]
name = "mdview"
version = "0.7.1"
description = "mdcat + inline images and Mermaid in the terminal (single Rust binary)"
license = "MIT"
repository = "https://github.com/oharato/mdview"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
libc = "0.2.191"
# sequence diagram fixes are in vendor/mermaid-rs-renderer (see PATCHES.md)
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false }
# 2.7.1 は crates.io で yanked。2.10 以降は別メンテナのフォークなので、
# 公式 swsnr/mdcat の最後のリリースである 2.9.0 に固定する。
pulldown-cmark-mdcat = { version = "=2.9.0", default-features = false }
regex = "1.13.1"
resvg = "0.49.0"
rustix = { version = "1.1.5", features = ["termios", "fs", "event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
syntect = "5.3.0"
ureq = "3.5.0"

[[bin]]
name = "mdview"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# 0.3.1 + sequence label wrap / lifeline width fixes
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer" }
